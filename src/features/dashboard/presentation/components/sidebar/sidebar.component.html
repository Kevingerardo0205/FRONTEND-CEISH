<div class="sidebar-wrapper">
  <div class="sidenav-header">
    <div class="logo-container">
      <mat-icon class="sidenav-logo-icon">medical_services</mat-icon>
      <div class="logo-text">
        <h2>CEISH Espoch</h2>
        <p>Comité de Ética</p>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Menú principal">
    @if (needsVerification()) {
      <p class="nav-notice" data-testid="verify-email-notice">Verifica tu correo para crear y ver tus protocolos.</p>
    } @else {
      <ul class="nav-list">
        @for (item of menuItems(); track item.id) {
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="item.route"
              routerLinkActive="active"
              #rla="routerLinkActive"
              [attr.aria-current]="rla.isActive ? 'page' : null"
              (click)="onNavClick()"
            >
              <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
              <span class="nav-label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </nav>

  <div class="sidenav-footer">
    <button type="button" class="nav-link logout-link" (click)="onLogout()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span class="nav-label">Cerrar sesión</span>
    </button>
  </div>
</div>
