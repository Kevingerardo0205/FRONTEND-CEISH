<div class="sidebar-wrapper">
  <div class="sidenav-header">
    <div class="logo-container">
      <mat-icon class="sidenav-logo-icon">medical_services</mat-icon>
      <div class="logo-text">
        <h2>CEISH Espoch</h2>
        <p>Comité de Ética</p>
      </div>
    </div>
  </div>

  <div class="nav-section-title">MENÚ PRINCIPAL</div>
  
  <div class="menu-container">
    <mat-accordion [multi]="false" class="sidebar-accordion">
      @for (group of authFacade.menuConfig(); track group.code) {
        <mat-expansion-panel 
          [expanded]="activeModule() === group.code"
          class="module-panel"
          hideToggle="false">
          
          <mat-expansion-panel-header class="module-header">
            <mat-panel-title>
              <mat-icon class="module-icon">{{ group.icon }}</mat-icon>
              <span class="module-label">{{ group.label }}</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-nav-list class="sub-menu-list">
            @for (sub of group.subItems; track sub.path) {
              <a mat-list-item 
                 [routerLink]="sub.path" 
                 routerLinkActive="active-link" 
                 (click)="onNavClick()"
                 class="menu-item">
                <mat-icon matListItemIcon class="item-icon">{{ sub.icon }}</mat-icon>
                <span matListItemTitle class="item-label">{{ sub.label }}</span>
              </a>
            }
          </mat-nav-list>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>

  <div class="sidebar-spacer"></div>

  <div class="sidenav-footer">
    <button mat-button class="logout-button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</div>
