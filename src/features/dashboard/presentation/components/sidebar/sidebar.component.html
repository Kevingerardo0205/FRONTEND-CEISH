<div class="sidebar-wrapper">
  <div class="sidenav-header">
    <div class="logo-container">
      <mat-icon class="sidenav-logo-icon">medical_services</mat-icon>
      <div class="logo-text">
        <h2>CEISH Espoch</h2>
        <p>Comité de Ética</p>
      </div>
    </div>
  </div>

  <div class="nav-section-title">MENÚ PRINCIPAL</div>
  
  <div class="menu-container">
    @for (group of authFacade.menuConfig(); track group.module.code) {
      <div class="module-group">
        <div class="module-header">
          <mat-icon>{{ group.module.icon }}</mat-icon>
          <span>{{ group.module.name }}</span>
        </div>

        <mat-nav-list class="menu-list">
          @for (sub of group.subItems; track sub.code) {
            <a mat-list-item 
               [routerLink]="getRoute(sub.code)" 
               routerLinkActive="active-link" 
               (click)="onNavClick()"
               class="menu-item">
              <mat-icon matListItemIcon class="menu-icon">{{ getIcon(sub.code) }}</mat-icon>
              <span matListItemTitle class="menu-label">{{ getLabel(sub.code) }}</span>
            </a>
          }
        </mat-nav-list>
      </div>
    }
  </div>

  <div class="sidebar-spacer"></div>

  <div class="sidenav-footer">
    <button mat-button class="logout-button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar Sesión</span>
    </button>
  </div>
</div>
