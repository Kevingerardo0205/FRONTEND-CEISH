<mat-sidenav-container class="dashboard-container">
  
  <!-- SIDEBAR -->
  <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="dashboard-sidenav">
    <app-sidebar [isMobile]="isMobile" (navClick)="onNavClick()"></app-sidebar>
  </mat-sidenav>

  <!-- MAIN CONTENT -->
  <mat-sidenav-content class="dashboard-content">
    <mat-toolbar class="dashboard-toolbar">
      <div class="toolbar-left">
        <button mat-icon-button (click)="sidenav.toggle()" class="menu-toggle-btn">
          <mat-icon>menu_open</mat-icon>
        </button>
        <div class="header-breadcrumb">
          <span class="toolbar-title">Panel de Gestión</span>
          <span class="toolbar-date">{{ currentDate() | date:'fullDate':'':'es' }}</span>
        </div>
      </div>
      
      <span class="spacer"></span>

      <div class="toolbar-actions">
        <!-- Notifications -->
        <button mat-icon-button class="notification-btn">
          <mat-icon>notifications_none</mat-icon>
          <span class="notification-badge"></span>
        </button>

        <mat-divider vertical class="toolbar-divider"></mat-divider>

        <!-- User Profile Menu -->
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-button">
          <div class="user-info-text" *ngIf="!isMobile">
            <span class="user-name">{{ userName() }}</span>
            <span class="user-role">{{ userRole() }}</span>
          </div>
          <div class="user-avatar">
            {{ userInitials() }}
          </div>
          <mat-icon class="expand-icon">expand_more</mat-icon>
        </button>
      </div>

      <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu-panel">
        <div class="menu-header">
          <span class="menu-user-name">{{ userName() }}</span>
          <span class="menu-user-email">{{ userEmail() }}</span>
        </div>
        
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Mi Perfil</span>
        </button>
        <button mat-menu-item>
          <mat-icon>settings</mat-icon>
          <span>Configuración</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogout()">
          <mat-icon color="warn">logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content-body">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
