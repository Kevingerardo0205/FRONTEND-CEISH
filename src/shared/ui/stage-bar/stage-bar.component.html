<ol class="stage-bar" aria-label="Etapas del protocolo">
  @for (step of steps(); track step.stage.code) {
    <li
      class="step"
      [class.step--done]="step.status === 'done'"
      [class.step--current]="step.status === 'current'"
      [class.step--pending]="step.status === 'pending'"
      [attr.aria-current]="step.status === 'current' ? 'step' : null"
      [attr.data-stage]="step.stage.code"
    >
      <span class="step__bar" aria-hidden="true"></span>
      <!-- El estado de cada etapa se dice con texto oculto (F00 §5, como F09 D19) -->
      <span class="step__name">
        <span class="step__label">{{ step.stage.label }}</span>
        @if (step.status === 'done') {
          <span class="step__check" aria-hidden="true">✓</span>
        }
        <span class="visually-hidden">, {{ statusText[step.status] }}</span>
      </span>
      @if (step.status === 'current' && detail()) {
        <span class="step__detail">{{ detail() }}</span>
      }
    </li>
  }
</ol>
