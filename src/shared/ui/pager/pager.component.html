@if (total() > 0) {
  <nav class="pager" aria-label="Paginación">
    <p class="pager__info" aria-live="polite">Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }}</p>
    <div class="pager__botones">
      <button type="button" class="pager__boton" [disabled]="esPrimera()" (click)="ir(page() - 1)">
        Anterior
      </button>
      <button type="button" class="pager__boton" [disabled]="esUltima()" (click)="ir(page() + 1)">
        Siguiente
      </button>
    </div>
  </nav>
}
