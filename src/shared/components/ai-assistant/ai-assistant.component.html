<div class="ai-assistant-wrapper" [class.panel-open]="isOpen()">

  <!-- BOTÓN FLOTANTE ACTIVADOR -->
  <button class="ai-assistant-trigger" (click)="toggleOpen()" aria-label="Abrir Asistente de IA">
    <div class="trigger-icon-container">
      <mat-icon *ngIf="!isOpen()">smart_toy</mat-icon>
      <mat-icon *ngIf="isOpen()">close</mat-icon>
    </div>
    <span class="trigger-tooltip" *ngIf="!isOpen()">Asistente de IA</span>
  </button>

  <!-- VENTANA DEL CHAT -->
  <div class="ai-chat-panel" *ngIf="isOpen()">
    
    <!-- Cabecera -->
    <div class="chat-header">
      <div class="header-bot-info">
        <div class="bot-avatar">
          <mat-icon>smart_toy</mat-icon>
          <div class="online-indicator"></div>
        </div>
        <div class="bot-details">
          <span class="bot-name">Asistente CEISH</span>
          <span class="bot-status">Normativa PET y Protocolo</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button (click)="resetChat()" title="Reiniciar conversación" aria-label="Reiniciar conversación" style="background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0.8; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">
          <mat-icon style="font-size: 20px; width: 20px; height: 20px;">delete_sweep</mat-icon>
        </button>
        <button class="header-close-btn" (click)="toggleOpen()" aria-label="Cerrar panel">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Contenedor de Mensajes -->
    <div class="chat-messages-area" #chatMessagesContainer>
      <div class="messages-list">
        <div *ngFor="let msg of messages()" class="message-row" [class.user-row]="msg.sender === 'user'" [class.assistant-row]="msg.sender === 'assistant'">
          
          <div class="message-avatar" *ngIf="msg.sender === 'assistant'">
            <mat-icon>smart_toy</mat-icon>
          </div>

          <div class="message-bubble" [class.user-bubble]="msg.sender === 'user'" [class.assistant-bubble]="msg.sender === 'assistant'">
            <div [innerHTML]="msg.parsedContent"></div>
          </div>
          
        </div>

        <!-- Indicador de carga / Escribiendo -->
        <div class="message-row assistant-row" *ngIf="isLoading()">
          <div class="message-avatar">
            <mat-icon>smart_toy</mat-icon>
          </div>
          <div class="message-bubble assistant-bubble typing-bubble">
            <div class="typing-loader">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Acciones Rápidas (Chips de Sugerencia) -->
    <div class="chat-quick-actions" *ngIf="!isLoading()">
      <button 
        *ngFor="let prompt of quickPrompts()" 
        class="quick-action-chip" 
        (click)="sendMessage(prompt.query)">
        {{ prompt.label }}
      </button>
    </div>

    <!-- Formulario / Campo de Entrada -->
    <div class="chat-input-area">
      <input 
        type="text" 
        class="chat-text-input" 
        placeholder="Escribe tu consulta sobre normativa o protocolo..."
        [(ngModel)]="userMessage"
        (keyup.enter)="sendMessage()"
        [disabled]="isLoading()"
      />
      <button 
        class="chat-send-btn" 
        (click)="sendMessage()" 
        [disabled]="isLoading() || !userMessage().trim()"
        aria-label="Enviar mensaje">
        <mat-icon>send</mat-icon>
      </button>
    </div>

  </div>

</div>
